version: '3.8'

services:
  # ClickHouse Database
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: sarosobserv-clickhouse
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    environment:
      CLICKHOUSE_DB: sarosobserv
      CLICKHOUSE_USER: sarosobserv
      CLICKHOUSE_PASSWORD: sarosobserv
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./storage/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sarosobserv-network

  # SarosObserv Backend
  backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: sarosobserv-backend
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "8081:8080"  # REST API
    environment:
      CLICKHOUSE_DSN: clickhouse://sarosobserv:sarosobserv@clickhouse:9000/sarosobserv
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - sarosobserv-network
    restart: unless-stopped

  # SarosObserv Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/docker/Dockerfile.frontend
    container_name: sarosobserv-frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8081
    depends_on:
      - backend
    networks:
      - sarosobserv-network
    restart: unless-stopped

volumes:
  clickhouse_data:
    driver: local

networks:
  sarosobserv-network:
    driver: bridge
